<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Leader Shield Funding - Agent Portal</title>
    <meta name="description" content="Leader Shield Funding agent portal for MCA and Merchant Growth Platform agents. Manage deals, track commissions, build recurring revenue, and grow your team." />
    <meta property="og:title" content="Leader Shield Funding - Agent Portal" />
    <meta property="og:description" content="Leader Shield Funding agent portal for MCA and Merchant Growth Platform agents. Manage deals, track commissions, build recurring revenue, and grow your team." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Leader Shield Funding",
          "url": "https://leadershieldfunding.com",
          "logo": "https://leadershieldfunding.com/favicon.svg",
          "description": "Leader Shield Funding is a full-service MCA brokerage and recurring-revenue platform. Agents earn commissions on merchant cash advances and Merchant Growth Platform subscriptions through a structured binary network.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "Leader Shield Funding",
          "url": "https://leadershieldfunding.com"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does merchant cash advance funding work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Funding is structured as a merchant cash advance with a fixed factor rate (15%–49%), not a traditional APR-based loan. Amounts range from $2,000 to $2,000,000, with repayment over 30 days to 24 months via ACH or card processing holdbacks. Every file is reviewed individually based on revenue, time in business, credit, and cash flow."
              }
            },
            {
              "@type": "Question",
              "name": "How fast can a business get funded?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "With minimal paperwork — a one-page application, three to six months of bank statements, a driver's license, and a voided business check — funding can be available as quickly as one business day after underwriting review."
              }
            },
            {
              "@type": "Question",
              "name": "How does the 1% affiliate referral work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Referral partners simply introduce the opportunity. Affiliate compensation is 1% of factoring origination — on an average $75,000 funded deal, that's an example payout of approximately $750. Leader Shield manages sales, underwriting, fulfillment, service, and the ongoing client relationship."
              }
            },
            {
              "@type": "Question",
              "name": "What is the Merchant Growth Platform?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Merchant Growth Platform is a subscription-based service designed to help merchants improve their financial visibility, accelerate revenue, and automate their marketing. It's a recurring revenue product that provides a stable, long-term income stream for full agents."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need experience to get started?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No prior experience is required. Our comprehensive training academy covers everything from product knowledge and sales techniques to compliance guidelines. You'll have access to scripts, objection handlers, and ongoing support from our team."
              }
            },
            {
              "@type": "Question",
              "name": "Can I sell MCA and subscriptions to the same merchant?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely, and we encourage it. When you pair a new subscription with a funded MCA, you earn a 5% commission enhancement on the subscription for the first three months. This pairing strategy maximizes your upfront earnings."
              }
            },
            {
              "@type": "Question",
              "name": "Is there a fee to be a Leader Shield agent?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Full agents pay a $99 monthly platform fee for access to the CRM, reporting, training, and support. This fee can be reduced (50% off at $3,000 revenue) or completely waived ($5,000+ revenue). Top producers get a $100 credit on top of the waiver. Referral-only affiliates have no platform fee."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
