              "@type": "Question",
              "name": "How does merchant cash advance funding work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Funding is structured as a merchant cash advance with a factor rate that is typically 15%–49%, set by underwriting based on the merchant's profile — not a traditional APR-based loan. A factor rate means the merchant repays the advance plus a single fixed fee, not interest that compounds over time. Amounts range from $2,000 to $2,000,000, with repayment over 30 days to 24 months via ACH or card processing holdbacks. Every file is reviewed individually based on revenue, time in business, credit, and cash flow."
              }
            },
            {
              "@type": "Question",
              "name": "How fast can a business get funded?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "With minimal paperwork — a one-page application, three to six months of bank statements, a driver's license, and a voided business check — funding can be available as quickly as one business day after underwriting review."
              }
            },
            {
              "@type": "Question",
              "name": "What is the Merchant Growth Platform?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Merchant Growth Platform is a subscription-based service that helps merchants generate leads, automate their marketing, and accelerate revenue with CRM and AI customer-acquisition tools, delivered through an exclusive partnership with Marketing Titan AI and Lead Titan AI. It's a recurring revenue product that provides a stable, long-term income stream for agents."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need experience to get started?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No prior experience is required — drive and relationships matter more than your background. Our comprehensive training academy covers everything from product knowledge and sales techniques to compliance guidelines. You'll have access to scripts, objection handlers, and ongoing support from our team."
              }
            },
            {
              "@type": "Question",
              "name": "Can I sell both MCA and subscriptions to the same merchant?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes — when it's the right fit for the merchant. Distributors can offer both products, and consistent MCA-plus-subscription attachment is one of the performance accelerators that can lift your subscription commission pool by up to an additional +5%. It's an accelerator earned across your production, not a standalone per-deal pairing bonus, and you should only place products that genuinely suit the merchant's needs."
              }
            },
            {
              "@type": "Question",
              "name": "Is there a fee to be a LeaderShield agent?",
              "acceptedAnswer": {
                "@type": "Answer",
